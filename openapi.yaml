  /xqtl:
    get:
      tags:
        - xQTL
      summary: Conditionally independent cis-xQTLs by gene
      description: Fetch conditionally independent cis-xQTLs in any tissue for a gene
      parameters:
        - name: geneId
          in: query
          description: Gene ID Rat gene symbol/annotation identifier, not an Ensembl ID.
          required: true
          schema:
            type: string
            example: Cd300lf
        - name: tissueId
          in: query
          required: false
          description: Select tissues; omitted means all tissues.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: tissueSiteDetailId
          in: query
          required: false
          description: Legacy alias of tissueId. Do not use both aliases.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: limit
          in: query
          required: false
          description: Optional page size. Omit both limit and offset to preserve the full
            legacy response.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          required: false
          description: Zero-based record offset. Pagination metadata appears when limit or
            offset is supplied.
          schema:
            type: integer
            minimum: 0
            maximum: 1000000000
            default: 0
        - name: modality
          in: query
          required: false
          description: Optional modality filter; values must occur in the release.
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  xqtl:
                    type: array
                    items:
                      type: object
                      properties:
                        alt:
                          type: string
                          example: A
                        geneId:
                          type: string
                          example: Cd300lf
                        modality:
                          type: string
                          example: splicing
                        pValueBeta:
                          type: number
                          example: 3.72035e-15
                          description: Beta-approximated permutation p-value from the source file. This is
                            not a q-value or FDR.
                          nullable: true
                        phenotypeId:
                          type: string
                          example: Cd300lf__chr10_100862967_100866541_clu_7827_-
                        ref:
                          type: string
                          example: G
                        tissueSiteDetailId:
                          type: string
                          example: pVTA
                        variantId:
                          type: string
                          example: chr10:101009133
                        chromosome:
                          type: string
                        pos:
                          type: integer
                        altAlleleFrequency:
                          type: number
                          nullable: true
                        tssDistance:
                          type: integer
                        pValue:
                          type: number
                          nullable: true
                          description: Nominal association p-value.
                        slope:
                          type: number
                          nullable: true
                          description: Nominal regression coefficient from the compiled pipeline output.
                        slopeSE:
                          type: number
                          nullable: true
                          description: Standard error of the nominal regression coefficient.
                        rank:
                          type: integer
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "304":
          description: Unchanged representation (If-None-Match matched the ETag).
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "503":
          $ref: "#/components/responses/503"
      operationId: xqtl
