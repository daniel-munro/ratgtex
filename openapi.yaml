                    description: Definitions of the released sample vectors; no request-time
                      normalization or covariate adjustment.
                  terminology:
                    type: object
                    additionalProperties:
                      type: string
                  limits:
                    type: object
                    additionalProperties:
                      type: integer
                  endpointAliases:
                    type: object
                    additionalProperties:
