  /variant:
    get:
      tags:
        - reference
      summary: Metadata for one or more variants
      description: Fetch information for one or more variants Exact 1-based positions
        are required. Missing, ambiguous-position and multiallelic records are
        listed in notFound.
      parameters:
        - name: variantId
          in: query
          description: Variant ID
