openapi: 3.0.0
security: []
info:
  title: RatGTEx REST API
  version: 4.2.0
  description: >-
    Read-only API for RatGTEx release v4 (Rattus norvegicus, GRCr8).
    Gene IDs are rat gene symbols or annotation identifiers, matched exactly
    or unambiguously without regard to case. Variant IDs use chromosome:position
    with 1-based positions and must identify one biallelic record. Gene and exon
    coordinates are 1-based inclusive.


    /genotypePhenotypes returns normalized RNA phenotype vectors and on-demand
    nominal associations for one gene, variant, tissue and modality. Tests use
    released modality-specific covariates. Missing genotypes are mean-imputed
    for inference while remaining null in the displayed genotype vector.
    Significance thresholds and permutation results are precomputed.
    /geneExpression provides expression-only queries, with expressionScale=tpm
    (default) or normalized. Displayed values have no additional covariate adjustment.
    maf is minor allele frequency; altAlleleFrequency is alternate allele frequency.


    /metadata lists modalities, tissues, genotype datasets, endpoints and limits.
    List parameters are comma-separated; repeated parameters and empty identifiers
    are rejected. tissueId and tissueSiteDetailId are accepted query names;
    supply only one. Missing or nonfinite numeric values are JSON null.
    Malformed requests return 400, missing individual resources 404, unsupported
    variants 422, and unavailable release data or indexes 503.


    Successful JSON responses support ETag/If-None-Match, gzip and a five-minute
    public cache, except for prediction subsets, which use no-store.
    Use release downloads for bulk data. Publish matching source
    files and indexes together and restart API workers after a release update.
  contact:
    name: Daniel Munro
    x-role: responsible developer
    email: danbmunro@gmail.com
    url: https://danmun.ro
    x-id: https://danmun.ro
servers:
  - url: https://ratgtex.org/api/v4
    description: RatGTEx data portal
tags:
  - name: reference
    description: Information on tissues, genes, and variants
  - name: expression
    description: Gene expression data
  - name: xQTL
    description: Data on RNA phenotype-variant associations
paths:
  /predictions:
    get:
      tags: [expression]
      summary: Published Round 11.2 RNA phenotype predictions for selected rats
      description: >-
        Select up to five genes and 100 rat RFIDs. Scores are returned as text
        to preserve their published precision. The result may contain up to
        2,000 phenotype rows. Partial indexes return available results and
        list unavailable tissue and modality combinations.
      parameters:
        - name: geneId
          in: query
          required: true
          schema:
            type: array
            maxItems: 5
            items:
              type: string
          style: form
          explode: false
        - name: rfid
          in: query
          required: true
          description: Rat RFIDs. Column order follows request order.
          schema:
            type: array
            maxItems: 100
            items:
              type: string
          style: form
          explode: false
        - name: tissueId
          in: query
          description: Select tissues. Omit for all tissues.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: tissueSiteDetailId
          in: query
          description: Alias of tissueId. Supply only one of these parameters.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: modality
          in: query
          description: Select one modality. Omit for all modalities.
          schema:
            type: string
            enum: [expression, isoforms, splicing, alt_TSS, alt_polyA, stability]
      responses:
        "200":
          description: Published predictions and coverage of the requested IDs and datasets
          content:
            application/json:
              schema:
                type: object
                properties:
                  cohort:
                    type: string
                    example: round11_2
                  rfids:
                    type: array
                    items:
                      type: string
                  unmatchedRfids:
                    type: array
                    description: RFIDs absent from every indexed dataset selected in this request.
                    items:
                      type: string
                  unknownGenes:
                    type: array
                    items:
                      type: string
                  genesWithoutPredictions:
                    type: array
                    description: Recognized genes without predictions in the selected, indexed datasets.
                    items:
                      type: string
                  unavailableDatasets:
                    type: array
                    items:
                      type: object
                      properties:
                        tissue:
                          type: string
                        modality:
                          type: string
                  predictions:
                    type: array
                    items:
                      type: object
                      properties:
                        geneId:
                          type: string
                        tissue:
                          type: string
                        modality:
                          type: string
                        phenotypeId:
                          type: string
                        values:
                          type: array
                          description: Aligned to rfids. Null means the RFID is absent from this dataset.
                          items:
                            type: string
                            nullable: true
        "400":
          description: Invalid parameters or result exceeds the row limit
        "503":
          description: No selected prediction index is available, or an index could not be read
  /eqtl:
    get:
      tags:
        - xQTL
      summary: Conditionally independent cis-eQTLs by gene
      description: >-
        Fetch conditionally independent cis-eQTLs for a gene. Tissue filtering,
        counts and pagination use the prepared API catalog. Results follow source
        order. A missing or stale catalog returns 503.
      parameters:
        - name: geneId
          in: query
          description: Gene ID Rat gene symbol/annotation identifier, not an Ensembl ID.
          required: true
          schema:
            type: string
            example: Cd300lf
        - name: tissueId
          in: query
          required: false
          description: Select tissues; omitted means all tissues.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: tissueSiteDetailId
          in: query
          required: false
          description: Legacy alias of tissueId. Do not use both aliases.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: limit
          in: query
          required: false
          description: Optional page size. Omit both limit and offset to preserve the full response.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          required: false
          description: Zero-based record offset. Pagination metadata appears when limit or
            offset is supplied.
          schema:
            type: integer
            minimum: 0
            maximum: 1000000000
            default: 0
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  eqtl:
                    type: array
                    items:
                      type: object
                      properties:
                        alt:
                          type: string
                          example: T
                        geneId:
                          type: string
                          example: Cd300lf
                        log2aFC:
                          type: number
                          example: 0.65925
                          nullable: true
                        pValueBeta:
                          type: number
                          example: 0.00000805017
                          description: Beta-approximated permutation p-value from the source file. This is
                            not a q-value or FDR.
                          nullable: true
                        ref:
                          type: string
                          example: C
                        tissueSiteDetailId:
                          type: string
                          example: IL
                        variantId:
                          type: string
                          example: chr10:100826333
                        chromosome:
                          type: string
                        pos:
                          type: integer
                        altAlleleFrequency:
                          type: number
                          nullable: true
                        tssDistance:
                          type: integer
                        pValue:
                          type: number
                          nullable: true
                          description: Nominal association p-value.
                        slope:
                          type: number
                          nullable: true
                          description: Nominal regression coefficient from the compiled pipeline output.
                        slopeSE:
                          type: number
                          nullable: true
                          description: Standard error of the nominal regression coefficient.
                        rank:
                          type: integer
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "304":
          description: Unchanged representation (If-None-Match matched the ETag).
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "503":
          $ref: "#/components/responses/503"
      operationId: eqtl
  /exon:
    get:
      tags:
        - reference
      summary: Exon annotations for a gene
      description: >-
        Fetch a gene's exons from the prepared API catalog, with source ordering
        and SQL pagination. A missing or stale catalog returns 503.
      parameters:
        - name: geneId
          in: query
          description: Gene ID Rat gene symbol/annotation identifier, not an Ensembl ID.
          required: true
          schema:
            type: string
            example: Cd300lf
        - name: limit
          in: query
          required: false
          description: Optional page size. Omit both limit and offset to preserve the full response.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          required: false
          description: Zero-based record offset. Pagination metadata appears when limit or
            offset is supplied.
          schema:
            type: integer
            minimum: 0
            maximum: 1000000000
            default: 0
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  exon:
                    type: array
                    items:
                      type: object
                      properties:
                        chromosome:
                          type: string
                          example: chr1
                        end:
                          type: integer
                          example: 100875111
                        exonId:
                          type: string
                          example: Cd300lf_1
                        exonNumber:
                          type: integer
                          example: 1
                        featureType:
                          type: string
                          example: exon
                        geneId:
                          type: string
                          example: Cd300lf
                        start:
                          type: integer
                          example: 100874927
                        strand:
                          type: string
                          enum:
                            - "-"
                            - +
                          example: "-"
                        transcriptId:
                          type: string
                          example: Cd300lf
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "304":
          description: Unchanged representation (If-None-Match matched the ETag).
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "503":
          $ref: "#/components/responses/503"
      operationId: exon
  /gene:
    get:
      tags:
        - reference
      summary: Metadata for one or more genes
      description: Fetch metadata for one or more genes
      parameters:
        - name: geneId
          in: query
          description: One or more gene IDs Rat gene symbol/annotation identifier, not an
            Ensembl ID.
          required: true
          schema:
            type: array
            items:
              type: string
            example:
              - Cd300lf
              - Eno1
            maxItems: 500
          style: form
          explode: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  gene:
                    type: array
                    items:
                      type: object
                      properties:
                        chromosome:
                          type: string
                          example: chr10
                        description:
                          type: string
                          example: Cd300 molecule-like family member F
                        end:
                          type: integer
                          example: 100875111
                        geneId:
                          type: string
                          example: Cd300lf
                        hasEqtl:
                          type: boolean
                          example: true
                        hasTwas:
                          type: boolean
                          description: Whether the gene has a page in the Rat TWAS Hub
                          example: true
                        start:
                          type: integer
                          example: 100858924
                        statusInTissue:
                          type: array
                          items:
                            type: object
                            properties:
                              eqtl:
                                type: boolean
                                example: true
                              expressed:
                                type: boolean
                                example: true
                              testedEqtl:
                                type: boolean
                                example: true
                              tissueSiteDetailId:
                                type: string
                                example: IL
                        strand:
                          type: string
                          example: "-"
                        tss:
                          type: integer
                          example: 100875111
                  notFound:
                    type: array
                    items:
                      type: string
        "304":
          description: Unchanged representation (If-None-Match matched the ETag).
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "503":
          $ref: "#/components/responses/503"
      operationId: gene
  /geneExpression:
    get:
      tags:
        - expression
      summary: Per-sample expression for selected genes and tissues
      description: Return sample expression vectors. Absent gene/tissue measurements
        are omitted. A gene exists independently of whether a normalized
        phenotype was retained for that tissue. Default values remain TPM.
      parameters:
        - name: geneId
          in: query
          required: true
          description: Up to 10 gene IDs.
          schema:
            type: array
            items:
              type: string
            maxItems: 10
          style: form
          explode: false
        - name: tissueId
          in: query
          required: false
          description: Select tissues; omitted means all tissues.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: tissueSiteDetailId
          in: query
          required: false
          description: Legacy alias of tissueId. Do not use both aliases.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: expressionScale
          in: query
          required: false
          description: "tpm: unnormalized transcripts per million. normalized:
            quantile-normalized, inverse-normal transformed expression
            phenotype. Display selection only; nominal tests use normalized phenotypes."
          schema:
            type: string
            enum:
              - tpm
              - normalized
            default: tpm
        - name: includeSampleIds
          in: query
          required: false
          description: Include sampleIds aligned one-to-one with data and phenotype data vectors. Sample order is meaningful only
            together with these IDs.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  geneExpression:
                    type: array
                    items:
                      type: object
                      properties:
                        data:
                          type: array
                          items:
                            type: number
                            nullable: true
                          example:
                            - 3.33544
                            - 2.679
                            - 4.03568
                            - 2.18627
                        datasetId:
                          type: string
                          example: ratgtex_v4
                        geneId:
                          type: string
                          example: Cd300lf
                        geneSymbol:
                          type: string
                          example: Cd300lf
                        tissueSiteDetailId:
                          type: string
                          example: IL
                        unit:
                          type: string
                          enum:
                            - TPM
                            - normalized expression
                        expressionScale:
                          type: string
                          enum:
                            - tpm
                            - normalized
                        sampleCount:
                          type: integer
                        genotypeDatasetId:
                          type: string
                        sampleIds:
                          type: array
                          items:
                            type: string
                  notFound:
                    type: array
                    items:
                      type: string
        "304":
          description: Unchanged representation (If-None-Match matched the ETag).
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "503":
          $ref: "#/components/responses/503"
      operationId: geneExpression
  /medianGeneExpression:
    get:
      tags:
        - expression
      summary: Median expression for genes in selected tissues
      description: Fetch median expression (TPM) for one or more genes in one or more
        tissues Unresolved genes are omitted. Empty results and singleton
        dimensions have clusters set to the string "Not enough data".
        Missing/nonfinite distances also omit clustering. Median values retain
        the release file precision.
      parameters:
        - name: geneId
          in: query
          description: One or more gene IDs. Rat gene symbol/annotation identifier, not an
            Ensembl ID.
          required: true
          schema:
            type: array
            items:
              type: string
            example:
              - Polr3k
              - Rtel1
              - Eno1
            maxItems: 500
          style: form
          explode: false
        - name: tissueId
          in: query
          required: false
          description: Select tissues; omitted means all tissues.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: tissueSiteDetailId
          in: query
          required: false
          description: Legacy alias of tissueId. Do not use both aliases.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: cluster
          in: query
          required: false
          description: Compute average-linkage Euclidean clustering with optimal leaf
            ordering on the released TPM medians. Maximum 200 genes when
            enabled; 500 with cluster=false.
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  clusters:
                    type: object
                    properties:
                      gene:
                        type: string
                        example: ((Rtel1:233.244,Polr3k:233.244):1054.57,Eno1:1287.81);
                      tissue:
                        type: string
                        example: ((IL:12.7061,LHb:12.7061):291.773,NAcc:304.479);
                  medianGeneExpression:
                    type: array
                    items:
                      type: object
                      properties:
                        geneId:
                          type: string
                          example: Rtel1
                        median:
                          type: number
                          example: 22.957
                        tissueSiteDetailId:
                          type: string
                          example: IL
                  notFound:
                    type: array
                    items:
                      type: string
        "304":
          description: Unchanged representation (If-None-Match matched the ETag).
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "503":
          $ref: "#/components/responses/503"
      operationId: medianGeneExpression
  /tissueInfo:
    get:
      tags:
        - reference
      summary: Metadata for all tissues
      description: Fetch metadata for all tissues
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  tissueInfo:
                    type: array
                    items:
                      type: object
                      properties:
                        colorHex:
                          type: string
                          example: 377eb8
                        colorRgb:
                          type: string
                          example: 55,126,184
                        dataset:
                          type: string
                          example: ratgtex_v4_round11_1
                          description: Genotype cohort ID; use as genotypeDatasetId where supported.
                        datasetId:
                          type: string
                          example: ratgtex_v4
                        eGeneCount:
                          type: integer
                          example: 5475
                        expressedGeneCount:
                          type: integer
                          example: 24107
                        rnaSeqAndGenotypeSampleCount:
                          type: integer
                          example: 83
                        rnaSeqSampleCount:
                          type: integer
                          example: 83
                        tissueSite:
                          type: string
                          example: Brain
                        tissueSiteDetail:
                          type: string
                          example: Infralimbic cortex
                        tissueSiteDetailAbbr:
                          type: string
                          example: IL
                        tissueSiteDetailId:
                          type: string
                          example: IL
                        hasEGenes:
                          type: boolean
                          example: true
        "304":
          description: Unchanged representation (If-None-Match matched the ETag).
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "503":
          $ref: "#/components/responses/503"
      operationId: tissueInfo
  /topExpressedGene:
    get:
      tags:
        - expression
      summary: Top 50 genes by median expression in a tissue
      description: Fetch 50 genes with highest median expression in a tissue
      parameters:
        - name: filterMtGene
          in: query
          description: Whether mitochondrial genes should be omitted from the top gene list
          required: false
          schema:
            type: boolean
            example: true
        - name: tissueId
          in: query
          required: false
          description: Exactly one tissue is required using either alias.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: tissueSiteDetailId
          in: query
          required: false
          description: Legacy alias of tissueId. Do not use both aliases.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: limit
          in: query
          required: false
          description: Maximum returned genes, after mitochondrial filtering.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  topExpressedGene:
                    type: array
                    items:
                      type: object
                      properties:
                        chromosome:
                          type: string
                          example: chr11
                        datasetId:
                          type: string
                          example: ratgtex_v4
                        geneId:
                          type: string
                          example: LOC120093067
                        median:
                          type: number
                          example: 7700.68
                        tissueSiteDetailId:
                          type: string
                          example: IL
                        unit:
                          type: string
                          enum:
                            - TPM
                          example: TPM
        "304":
          description: Unchanged representation (If-None-Match matched the ETag).
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "503":
          $ref: "#/components/responses/503"
      operationId: topExpressedGene
  /variant:
    get:
      tags:
        - reference
      summary: Metadata for one or more variants
      description: Fetch information for one or more variants Exact 1-based positions
        are required. Missing, ambiguous-position and multiallelic records are
        listed in notFound.
      parameters:
        - name: variantId
          in: query
          description: Variant ID
          required: true
          schema:
            type: array
            items:
              type: string
            example:
              - chr10:100826333
              - chr10:100955984
            maxItems: 100
          style: form
          explode: false
        - name: genotypeDatasetId
          in: query
          required: false
          description: Genotype cohort to query, as listed by /metadata. Default preserves
            ratgtex_v4_round11_2 when present, otherwise the first tissue
            cohort. A variant absent in that cohort is listed in notFound.
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  variant:
                    type: array
                    items:
                      type: object
                      properties:
                        alt:
                          type: string
                          example: T
                        chromosome:
                          type: string
                          example: chr10
                        pos:
                          type: integer
                          example: 100826333
                        ref:
                          type: string
                          example: C
                        variantId:
                          type: string
                          example: chr10:100826333
                        genotypeDatasetId:
                          type: string
                  notFound:
                    type: array
                    items:
                      type: string
        "304":
          description: Unchanged representation (If-None-Match matched the ETag).
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "503":
          $ref: "#/components/responses/503"
      operationId: variant
  /xqtl:
    get:
      tags:
        - xQTL
      summary: Conditionally independent cis-xQTLs by gene
      description: >-
        Fetch conditionally independent cis-xQTLs for a gene. Tissue and modality
        filtering, counts and pagination use the prepared API catalog. Results
        follow source order. A missing or stale catalog returns 503.
      parameters:
        - name: geneId
          in: query
          description: Gene ID Rat gene symbol/annotation identifier, not an Ensembl ID.
          required: true
          schema:
            type: string
            example: Cd300lf
        - name: tissueId
          in: query
          required: false
          description: Select tissues; omitted means all tissues.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: tissueSiteDetailId
          in: query
          required: false
          description: Legacy alias of tissueId. Do not use both aliases.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: limit
          in: query
          required: false
          description: Optional page size. Omit both limit and offset to preserve the full response.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          required: false
          description: Zero-based record offset. Pagination metadata appears when limit or
            offset is supplied.
          schema:
            type: integer
            minimum: 0
            maximum: 1000000000
            default: 0
        - name: modality
          in: query
          required: false
          description: Optional modality filter; values must occur in the release.
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  xqtl:
                    type: array
                    items:
                      type: object
                      properties:
                        alt:
                          type: string
                          example: A
                        geneId:
                          type: string
                          example: Cd300lf
                        modality:
                          type: string
                          example: splicing
                        pValueBeta:
                          type: number
                          example: 3.72035e-15
                          description: Beta-approximated permutation p-value from the source file. This is
                            not a q-value or FDR.
                          nullable: true
                        phenotypeId:
                          type: string
                          example: Cd300lf__chr10_100862967_100866541_clu_7827_-
                        ref:
                          type: string
                          example: G
                        tissueSiteDetailId:
                          type: string
                          example: pVTA
                        variantId:
                          type: string
                          example: chr10:101009133
                        chromosome:
                          type: string
                        pos:
                          type: integer
                        altAlleleFrequency:
                          type: number
                          nullable: true
                        tssDistance:
                          type: integer
                        pValue:
                          type: number
                          nullable: true
                          description: Nominal association p-value.
                        slope:
                          type: number
                          nullable: true
                          description: Nominal regression coefficient from the compiled pipeline output.
                        slopeSE:
                          type: number
                          nullable: true
                          description: Standard error of the nominal regression coefficient.
                        rank:
                          type: integer
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "304":
          description: Unchanged representation (If-None-Match matched the ETag).
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "503":
          $ref: "#/components/responses/503"
      operationId: xqtl
  /metadata:
    get:
      tags:
        - reference
      operationId: metadata
      summary: Release, terminology, limits, and endpoint discovery
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataRelease:
                    type: string
                    example: v4
                  genomeAssembly:
                    type: string
                    example: GRCr8
                  species:
                    type: string
                    example: Rattus norvegicus
                  tissueIds:
                    type: array
                    items:
                      type: string
                  genotypeDatasetIds:
                    type: array
                    items:
                      type: string
                  endpoints:
                    type: array
                    items:
                      type: string
                  documentation:
                    type: string
                  openapi:
                    type: string
                  coordinateSystems:
                    type: object
                    additionalProperties:
                      type: string
                  expressionScales:
                    type: object
                    additionalProperties:
                      type: string
                    description: Definitions of the released sample vectors; no request-time
                      additional adjustment to displayed values.
                  terminology:
                    type: object
                    additionalProperties:
                      type: string
                  limits:
                    type: object
                    additionalProperties:
                      type: integer
                  endpointAliases:
                    type: object
                    additionalProperties:
                      type: string
                    description: Deprecated paths mapped to their preferred replacements. Both
                      remain supported.
        "304":
          description: Unchanged representation.
        "400":
          $ref: "#/components/responses/400"
        "503":
          $ref: "#/components/responses/503"
  /genes:
    get:
      tags:
        - reference
      operationId: genes
      summary: Paginated gene directory and search
      parameters:
        - name: query
          in: query
          required: false
          description: Optional literal substring matched case-insensitively against gene
            IDs and descriptions.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size; this endpoint always returns pagination metadata.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          required: false
          description: Zero-based record offset. Pagination metadata appears when limit or
            offset is supplied.
          schema:
            type: integer
            minimum: 0
            maximum: 1000000000
            default: 0
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  gene:
                    type: array
                    items:
                      type: object
                      properties:
                        chromosome:
                          type: string
                          example: chr10
                        description:
                          type: string
                          example: Cd300 molecule-like family member F
                        end:
                          type: integer
                          example: 100875111
                        geneId:
                          type: string
                          example: Cd300lf
                        hasEqtl:
                          type: boolean
                          example: true
                        hasTwas:
                          type: boolean
                          description: Whether the gene has a page in the Rat TWAS Hub
                          example: true
                        start:
                          type: integer
                          example: 100858924
                        statusInTissue:
                          type: array
                          items:
                            type: object
                            properties:
                              eqtl:
                                type: boolean
                                example: true
                              expressed:
                                type: boolean
                                example: true
                              testedEqtl:
                                type: boolean
                                example: true
                              tissueSiteDetailId:
                                type: string
                                example: IL
                        strand:
                          type: string
                          example: "-"
                        tss:
                          type: integer
                          example: 100875111
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      limit:
                        type: integer
                      offset:
                        type: integer
        "304":
          description: Unchanged representation.
        "400":
          $ref: "#/components/responses/400"
        "503":
          $ref: "#/components/responses/503"
  /expressionSummary:
    get:
      tags:
        - expression
      operationId: expressionSummary
      summary: Compact per-tissue expression summaries
      description: Summaries use finite measurements only, without returning sample
        vectors. Quartiles use linear interpolation; no sampling or
        approximation. These medians are computed from the per-sample file;
        medianGeneExpression uses the precompiled release matrix, rounded during
        data preparation.
      parameters:
        - name: geneId
          in: query
          required: true
          description: Up to 10 gene IDs.
          schema:
            type: array
            items:
              type: string
            maxItems: 10
          style: form
          explode: false
        - name: tissueId
          in: query
          required: false
          description: Select tissues; omitted means all tissues.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: tissueSiteDetailId
          in: query
          required: false
          description: Legacy alias of tissueId. Do not use both aliases.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: expressionScale
          in: query
          required: false
          description: "tpm: unnormalized transcripts per million. normalized:
            quantile-normalized, inverse-normal transformed expression
            phenotype. Display selection only; nominal tests use normalized phenotypes."
          schema:
            type: string
            enum:
              - tpm
              - normalized
            default: tpm
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  expressionSummary:
                    type: array
                    items:
                      type: object
                      properties:
                        geneId:
                          type: string
                          example: Cd300lf
                        tissueSiteDetailId:
                          type: string
                          example: IL
                        expressionScale:
                          type: string
                          enum:
                            - tpm
                            - normalized
                        unit:
                          type: string
                          enum:
                            - TPM
                            - normalized expression
                        sampleCount:
                          type: integer
                        nonMissingCount:
                          type: integer
                        zeroCount:
                          type: integer
                        mean:
                          type: number
                          nullable: true
                        median:
                          type: number
                          nullable: true
                        q1:
                          type: number
                          nullable: true
                        q3:
                          type: number
                          nullable: true
                        min:
                          type: number
                          nullable: true
                        max:
                          type: number
                          nullable: true
                  notFound:
                    type: array
                    items:
                      type: string
        "304":
          description: Unchanged representation.
        "400":
          $ref: "#/components/responses/400"
        "503":
          $ref: "#/components/responses/503"
  /phenotypes:
    get:
      tags: [xQTL]
      summary: Inventory of measured RNA phenotypes for a gene
      description: >-
        Lists phenotype IDs, modality, tissue, coordinates, sample counts and
        significance thresholds without loading individual phenotype values or
        genotypes. Includes non-significant phenotypes. Omitted tissues and
        modality select all. Each tissue/modality dataset has a ready or
        unavailable status; ready datasets with zero phenotypes are distinct
        from unavailable datasets. Coordinates are 1-based inclusive.
      operationId: phenotypes
      parameters:
        - name: geneId
          in: query
          required: true
          schema: {type: string}
        - name: tissueId
          in: query
          description: Comma-separated tissue IDs; omitted means all tissues.
          schema: {type: string}
        - name: tissueSiteDetailId
          in: query
          description: Accepted alias of tissueId; do not supply both.
          schema: {type: string}
        - name: modality
          in: query
          schema:
            type: string
            enum: [expression, isoforms, splicing, alt_TSS, alt_polyA, stability]
      responses:
        "200":
          description: Phenotype inventory, with availability reported per tissue and modality.
          content:
            application/json:
              schema:
                type: object
                properties:
                  geneId: {type: string}
                  phenotypes:
                    type: array
                    items:
                      type: object
                      properties:
                        phenotypeId: {type: string}
                        geneId: {type: string}
                        modality: {type: string}
                        tissueSiteDetailId: {type: string}
                        chromosome: {type: string}
                        start: {type: integer}
                        end: {type: integer}
                        sampleCount: {type: integer}
                        pValueThreshold: {type: number, nullable: true}
                  datasets:
                    type: array
                    items:
                      type: object
                      properties:
                        modality: {type: string}
                        tissueSiteDetailId: {type: string}
                        status: {type: string, enum: [ready, unavailable]}
                        phenotypeCount: {type: integer, nullable: true}
        "304":
          description: Unchanged representation.
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "503":
          $ref: "#/components/responses/503"
  /genotypePhenotypes:
    get:
      tags: [xQTL]
      summary: Normalized phenotypes and on-demand cis associations for one gene, variant and modality
      description: >-
        Returns every available phenotype for one gene and modality, including
        non-significant phenotypes. Requires prepared phenotype indexes. The shared
        genotype vector and each data vector use the same sample order. Tests use
        released modality-specific covariates and normalized phenotypes; missing
        hardcalls are mean-imputed for inference only. No permutations or q-values
        are computed. The precomputed modality-specific gene/group threshold applies
        to all returned phenotypes. Invalid or stale inputs return 503. Outside-cis,
        low-MAF/MAC and untestable cases have null statistics and an explicit status.
      operationId: genotypePhenotypes
      parameters:
        - name: geneId
          in: query
          required: true
          schema: {type: string}
        - name: variantId
          in: query
          required: true
          schema: {type: string}
        - name: tissueId
          in: query
          description: Exactly one tissue is required, using this name or tissueSiteDetailId.
          schema: {type: string}
        - name: tissueSiteDetailId
          in: query
          description: Legacy alias of tissueId; do not supply both.
          schema: {type: string}
        - name: modality
          in: query
          schema:
            type: string
            enum: [expression, isoforms, splicing, alt_TSS, alt_polyA, stability]
            default: expression
        - name: phenotypeId
          in: query
          description: Optional single phenotype belonging to the queried gene and modality.
          schema: {type: string}
        - name: includeSampleIds
          in: query
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: Success. An empty phenotype list means no matching phenotype.
          content:
            application/json:
              schema:
                type: object
                properties:
                  genotypePhenotypes:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/NominalStatistics"
                        - type: object
                          properties:
                            phenotypeId: {type: string}
                            data:
                              type: array
                              items: {type: number}
                  geneId: {type: string}
                  variantId: {type: string}
                  tissueSiteDetailId: {type: string}
                  modality: {type: string}
                  genotypeDatasetId: {type: string}
                  ref: {type: string}
                  alt: {type: string}
                  genotypes:
                    type: array
                    items: {type: integer, nullable: true, minimum: 0, maximum: 2}
                  homoRefCount: {type: integer}
                  hetCount: {type: integer}
                  homoAltCount: {type: integer}
                  calledSampleCount: {type: integer}
                  missingGenotypeCount: {type: integer}
                  maf: {type: number, nullable: true}
                  altAlleleFrequency: {type: number, nullable: true}
                  sampleIds:
                    type: array
                    items: {type: string}
                  pValueThreshold: {type: number, nullable: true}
                  thresholdScope: {type: string, enum: [modality_gene_group]}
                  pValueSource: {type: string, enum: [computed]}
                  covariateScope: {type: string, enum: [modality]}
                  associationPhenotypeScale: {type: string, enum: [normalized]}
                  unit: {type: string, enum: [normalized phenotype]}
        "304":
          description: Unchanged representation.
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "422":
          $ref: "#/components/responses/422"
        "503":
          $ref: "#/components/responses/503"
  /significantCisEqtls:
    get:
      tags:
        - xQTL
      summary: Significant single-tissue cis-variants for a gene
      description: Fetch all significant cis-variants in all tissues for a gene
        Returns the full numeric precision stored in the source archive; no
        additional rounding is applied. This contains significant associations,
        not every tested cis-window variant. The response retains the
        significantCisEqtls collection key for compatibility. These are significant
        cis-eQTL associations across the selected tissues, distinct from the
        conditionally independent leads returned by /eqtl.
      parameters:
        - name: geneId
          in: query
          description: Gene ID Rat gene symbol/annotation identifier, not an Ensembl ID.
          required: true
          schema:
            type: string
            example: Cd300lf
        - name: tissueId
          in: query
          required: false
          description: Select tissues; omitted means all tissues.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: tissueSiteDetailId
          in: query
          required: false
          description: Legacy alias of tissueId. Do not use both aliases.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: limit
          in: query
          required: false
          description: Optional page size. Omit both limit and offset to preserve the full response.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          required: false
          description: Zero-based record offset. Pagination metadata appears when limit or
            offset is supplied.
          schema:
            type: integer
            minimum: 0
            maximum: 1000000000
            default: 0
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  significantCisEqtls:
                    type: array
                    items:
                      type: object
                      properties:
                        chromosome:
                          type: string
                          example: chr10
                        geneId:
                          type: string
                          example: Cd300lf
                        nes:
                          type: number
                          example: 0.592446
                          description: Legacy name for the regression slope (not log2 aFC).
                        pValue:
                          type: number
                          example: 2.111e-10
                        pos:
                          type: integer
                          example: 99876736
                        tissueSiteDetailId:
                          type: string
                          example: BLA
                        variantId:
                          type: string
                          example: chr10:99876736
                        slope:
                          type: number
                          nullable: true
                          description: Preferred explicit name for the value also returned as nes.
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "304":
          description: Unchanged representation (If-None-Match matched the ETag).
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "503":
          $ref: "#/components/responses/503"
      operationId: significantCisEqtls
components:
  schemas:
    AssociationStatus:
      type: string
      enum: [ok, no_called_genotypes, no_residual_genotype_variation, no_residual_phenotype_variation, nonfinite_phenotype, variant_below_mapping_filter, outside_cis_window]
    NominalStatistics:
      type: object
      properties:
        pValue: {type: number, nullable: true}
        slope:
          type: number
          nullable: true
          description: Additive slope on the normalized phenotype scale.
        slopeSE: {type: number, nullable: true}
        associationStatus:
          $ref: "#/components/schemas/AssociationStatus"
        associationSampleCount: {type: integer}
        imputedGenotypeCount: {type: integer}
        degreesOfFreedom: {type: integer}
        isCis: {type: boolean}
    Error:
      type: object
      properties:
        error:
          type: string
        status:
          type: integer
    Pagination:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
  responses:
    "400":
      description: Missing or invalid query parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "404":
      description: Requested resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "422":
      description: Variant is not biallelic.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "503":
      description: Required release files are unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
