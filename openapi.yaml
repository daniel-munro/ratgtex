openapi: 3.0.0
info:
  title: RatGTEx REST API
  version: 4.1.0
  description: >-
    Read-only API for RatGTEx release v4 (Rattus norvegicus, GRCr8). Existing
    GTEx-derived endpoint and response names remain supported. Gene IDs are rat
    gene symbols/annotation identifiers; exact spelling is preferred, with
    unambiguous case-insensitive matching. Variant IDs use
    chromosome:1-based-position and identify one biallelic record, not an
    allele-complete variant identifier. Gene/exon coordinates are 1-based
    inclusive.


    Use /metadata to discover release conventions, tissues, genotype datasets, and request limits; /genes provides paginated gene discovery. Prefer tissueId in new code; tissueSiteDetailId remains a query alias and the response field name. Do not send both aliases. List parameters are comma-separated, whitespace-trimmed and deduplicated; repeated query parameters are rejected. Missing/invalid parameters return JSON errors. Collection lookups may return empty arrays; notFound lists unresolved identifiers where supported. Missing/nonfinite numeric values are JSON null.


    /geneExpression defaults to unnormalized TPM. /genotypeExpression defaults to quantile-normalized, inverse-normal transformed expression, matching the eQTL visualization labels and correcting the former duplicate-TPM loading bug. expressionScale=tpm or expressionScale=normalized explicitly selects either source on both endpoints. No additional covariate adjustment is performed at request time. /genotypeExpression means genotype-stratified expression, not a temporal/dynamic eQTL test. Nominal association p-values come from the compiled mapping results; selecting an expression scale does not recompute them. maf is corrected to minor allele frequency; altAlleleFrequency preserves the alternate-allele-frequency quantity previously mislabeled maf.


    Successful responses support ETag/If-None-Match, gzip, and a five-minute public cache. The API is intended for bounded queries; use release downloads for bulk sample matrices and association files. Restart workers after replacing release files. Preferred endpoint names are /genotypeExpression and /significantCisEqtls. Their former paths /dyneqtl and /singleTissueEqtl remain supported as deprecated aliases with identical query parameters, defaults and response envelopes. Adding these paths is backward compatible; removing the aliases would require a breaking API revision, independently of data release versioning.
  contact:
    name: Daniel Munro
    x-role: responsible developer
    email: danbmunro@gmail.com
    url: https://danmun.ro
    x-id: https://danmun.ro
servers:
  - url: https://ratgtex.org/api/v4
    description: RatGTEx data portal
tags:
  - name: reference
    description: Information on tissues, genes, and variants
  - name: expression
    description: Gene expression data
  - name: xQTL
    description: Data on RNA phenotype-variant associations
paths:
  /dyneqtl:
    get:
      tags:
        - xQTL
      summary: Genotype-stratified expression for one gene and variant
      description: Deprecated alias of /genotypeExpression. Use that path for new
        integrations. Query parameters, defaults and response envelopes are
        identical. Return expression and genotype dosage arrays in matching
        sample order. The default is the released quantile-normalized,
        inverse-normal transformed expression phenotype; expressionScale=tpm
        explicitly selects unnormalized TPM. P-values are precomputed, not
        recalculated from these vectors. Only fully called diploid biallelic
        genotypes contribute to frequencies; partial, missing, haploid or
        non-biallelic calls become null. Frequencies are null if all calls are
        missing. A sample absent from the VCF has null dosage.
      parameters:
        - name: geneId
          in: query
          description: Gene ID Rat gene symbol/annotation identifier, not an Ensembl ID.
          required: true
          schema:
            type: string
            example: Cd300lf
        - name: tissueId
          in: query
          required: false
          description: Exactly one tissue is required using either alias.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: tissueSiteDetailId
          in: query
          required: false
          description: Legacy alias of tissueId. Do not use both aliases.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: variantId
          in: query
          description: Variant ID
          required: true
          schema:
            type: string
            example: chr10:100826333
        - name: expressionScale
          in: query
          required: false
          description: "tpm: unnormalized transcripts per million. normalized:
            quantile-normalized, inverse-normal transformed expression
            phenotype. Does not recompute association statistics."
          schema:
            type: string
            enum:
              - tpm
              - normalized
            default: normalized
        - name: includeSampleIds
          in: query
          required: false
          description: Include sampleIds aligned one-to-one with data and, for /dyneqtl,
            genotypes. Sample order is meaningful only together with these IDs.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  alt:
                    type: string
                    example: T
                  data:
                    type: array
                    items:
                      type: number
                      nullable: true
                    example:
                      - 2.2338
                      - 3.78302
                      - 3.71887
                      - 3.05015
                      - 2.46061
                  geneId:
                    type: string
                    example: Cd300lf
                  genotypes:
                    type: array
                    items:
                      type: integer
                      nullable: true
                      minimum: 0
                      maximum: 2
                    example:
                      - 1
                      - 1
                      - null
                      - 1
                      - 0
                  hetCount:
                    type: integer
                    example: 35
                  homoAltCount:
                    type: integer
                    example: 16
                  homoRefCount:
                    type: integer
                    example: 27
                  maf:
                    type: number
                    nullable: true
                    description: Minor allele frequency min(AF, 1-AF) among fully called diploid
                      samples. Corrected from the old alternate-allele-frequency
                      calculation.
                  pValue:
                    type: number
                    example: 8.43005e-8
                    nullable: true
                  pValueThreshold:
                    type: number
                    example: 0.00172939
                    nullable: true
                  ref:
                    type: string
                    example: C
                  tissueSiteDetailId:
                    type: string
                    example: IL
                  variantId:
                    type: string
                    example: chr10:100826333
                  altAlleleFrequency:
                    type: number
                    nullable: true
                    description: Alternate allele frequency among fully called diploid samples; can
                      exceed 0.5.
                  calledSampleCount:
                    type: integer
                  missingGenotypeCount:
                    type: integer
                  genotypeDatasetId:
                    type: string
                  expressionScale:
                    type: string
                    enum:
                      - tpm
                      - normalized
                  unit:
                    type: string
                    enum:
                      - TPM
                      - normalized expression
                  sampleIds:
                    type: array
                    items:
                      type: string
        "304":
          description: Unchanged representation (If-None-Match matched the ETag).
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "422":
          $ref: "#/components/responses/422"
        "503":
          $ref: "#/components/responses/503"
      operationId: dyneqtl
      deprecated: true
  /eqtl:
    get:
      tags:
        - xQTL
      summary: Conditionally independent cis-eQTLs by gene
      description: Fetch conditionally independent cis-eQTLs in any tissue for a gene
      parameters:
        - name: geneId
          in: query
          description: Gene ID Rat gene symbol/annotation identifier, not an Ensembl ID.
          required: true
          schema:
            type: string
            example: Cd300lf
        - name: tissueId
          in: query
          required: false
          description: Select tissues; omitted means all tissues.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: tissueSiteDetailId
          in: query
          required: false
          description: Legacy alias of tissueId. Do not use both aliases.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: limit
          in: query
          required: false
          description: Optional page size. Omit both limit and offset to preserve the full
            legacy response.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          required: false
          description: Zero-based record offset. Pagination metadata appears when limit or
            offset is supplied.
          schema:
            type: integer
            minimum: 0
            maximum: 1000000000
            default: 0
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  eqtl:
                    type: array
                    items:
                      type: object
                      properties:
                        alt:
                          type: string
                          example: T
                        geneId:
                          type: string
                          example: Cd300lf
                        log2aFC:
                          type: number
                          example: 0.65925
                          nullable: true
                        pValueBeta:
                          type: number
                          example: 0.00000805017
                          description: Beta-approximated permutation p-value from the source file. This is
                            not a q-value or FDR.
                          nullable: true
                        ref:
                          type: string
                          example: C
                        tissueSiteDetailId:
                          type: string
                          example: IL
                        variantId:
                          type: string
                          example: chr10:100826333
                        chromosome:
                          type: string
                        pos:
                          type: integer
                        altAlleleFrequency:
                          type: number
                          nullable: true
                        tssDistance:
                          type: integer
                        pValue:
                          type: number
                          nullable: true
                          description: Nominal association p-value.
                        slope:
                          type: number
                          nullable: true
                          description: Nominal regression coefficient from the compiled pipeline output.
                        slopeSE:
                          type: number
                          nullable: true
                          description: Standard error of the nominal regression coefficient.
                        rank:
                          type: integer
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "304":
          description: Unchanged representation (If-None-Match matched the ETag).
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "503":
          $ref: "#/components/responses/503"
      operationId: eqtl
  /exon:
    get:
      tags:
        - reference
      summary: Exon annotations for a gene
      description: Fetch a gene's exons
      parameters:
        - name: geneId
          in: query
          description: Gene ID Rat gene symbol/annotation identifier, not an Ensembl ID.
          required: true
          schema:
            type: string
            example: Cd300lf
        - name: limit
          in: query
          required: false
          description: Optional page size. Omit both limit and offset to preserve the full
            legacy response.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          required: false
          description: Zero-based record offset. Pagination metadata appears when limit or
            offset is supplied.
          schema:
            type: integer
            minimum: 0
            maximum: 1000000000
            default: 0
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  exon:
                    type: array
                    items:
                      type: object
                      properties:
                        chromosome:
                          type: string
                          example: chr1
                        end:
                          type: integer
                          example: 100875111
                        exonId:
                          type: string
                          example: Cd300lf_1
                        exonNumber:
                          type: integer
                          example: 1
                        featureType:
                          type: string
                          example: exon
                        geneId:
                          type: string
                          example: Cd300lf
                        start:
                          type: integer
                          example: 100874927
                        strand:
                          type: string
                          enum:
                            - "-"
                            - +
                          example: "-"
                        transcriptId:
                          type: string
                          example: Cd300lf
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "304":
          description: Unchanged representation (If-None-Match matched the ETag).
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "503":
          $ref: "#/components/responses/503"
      operationId: exon
  /gene:
    get:
      tags:
        - reference
      summary: Metadata for one or more genes
      description: Fetch metadata for one or more genes
      parameters:
        - name: geneId
          in: query
          description: One or more gene IDs Rat gene symbol/annotation identifier, not an
            Ensembl ID.
          required: true
          schema:
            type: array
            items:
              type: string
            example:
              - Cd300lf
              - Eno1
            maxItems: 500
          style: form
          explode: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  gene:
                    type: array
                    items:
                      type: object
                      properties:
                        chromosome:
                          type: string
                          example: chr10
                        description:
                          type: string
                          example: Cd300 molecule-like family member F
                        end:
                          type: integer
                          example: 100875111
                        geneId:
                          type: string
                          example: Cd300lf
                        hasEqtl:
                          type: boolean
                          example: true
                        hasTwas:
                          type: boolean
                          description: Whether the gene has a page in the Rat TWAS Hub
                          example: true
                        start:
                          type: integer
                          example: 100858924
                        statusInTissue:
                          type: array
                          items:
                            type: object
                            properties:
                              eqtl:
                                type: boolean
                                example: true
                              expressed:
                                type: boolean
                                example: true
                              testedEqtl:
                                type: boolean
                                example: true
                              tissueSiteDetailId:
                                type: string
                                example: IL
                        strand:
                          type: string
                          example: "-"
                        tss:
                          type: integer
                          example: 100875111
                  notFound:
                    type: array
                    items:
                      type: string
        "304":
          description: Unchanged representation (If-None-Match matched the ETag).
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "503":
          $ref: "#/components/responses/503"
      operationId: gene
  /geneExpression:
    get:
      tags:
        - expression
      summary: Per-sample expression for selected genes and tissues
      description: Return sample expression vectors. Absent gene/tissue measurements
        are omitted. A gene exists independently of whether a normalized
        phenotype was retained for that tissue. Default values remain TPM.
      parameters:
        - name: geneId
          in: query
          required: true
          description: Up to 10 gene IDs.
          schema:
            type: array
            items:
              type: string
            maxItems: 10
          style: form
          explode: false
        - name: tissueId
          in: query
          required: false
          description: Select tissues; omitted means all tissues.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: tissueSiteDetailId
          in: query
          required: false
          description: Legacy alias of tissueId. Do not use both aliases.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: expressionScale
          in: query
          required: false
          description: "tpm: unnormalized transcripts per million. normalized:
            quantile-normalized, inverse-normal transformed expression
            phenotype. Does not recompute association statistics."
          schema:
            type: string
            enum:
              - tpm
              - normalized
            default: tpm
        - name: includeSampleIds
          in: query
          required: false
          description: Include sampleIds aligned one-to-one with data and, for
            /genotypeExpression, genotypes. Sample order is meaningful only
            together with these IDs.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  geneExpression:
                    type: array
                    items:
                      type: object
                      properties:
                        data:
                          type: array
                          items:
                            type: number
                            nullable: true
                          example:
                            - 3.33544
                            - 2.679
                            - 4.03568
                            - 2.18627
                        datasetId:
                          type: string
                          example: ratgtex_v4
                        geneId:
                          type: string
                          example: Cd300lf
                        geneSymbol:
                          type: string
                          example: Cd300lf
                        tissueSiteDetailId:
                          type: string
                          example: IL
                        unit:
                          type: string
                          enum:
                            - TPM
                            - normalized expression
                        expressionScale:
                          type: string
                          enum:
                            - tpm
                            - normalized
                        sampleCount:
                          type: integer
                        genotypeDatasetId:
                          type: string
                        sampleIds:
                          type: array
                          items:
                            type: string
                  notFound:
                    type: array
                    items:
                      type: string
        "304":
          description: Unchanged representation (If-None-Match matched the ETag).
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "503":
          $ref: "#/components/responses/503"
      operationId: geneExpression
  /medianGeneExpression:
    get:
      tags:
        - expression
      summary: Median expression for genes in selected tissues
      description: Fetch median expression (TPM) for one or more genes in one or more
        tissues Unresolved genes are omitted. Empty results and singleton
        dimensions have clusters set to the legacy string "Not enough data".
        Missing/nonfinite distances also omit clustering. Median values retain
        the release file precision.
      parameters:
        - name: geneId
          in: query
          description: One or more gene IDs. Rat gene symbol/annotation identifier, not an
            Ensembl ID.
          required: true
          schema:
            type: array
            items:
              type: string
            example:
              - Polr3k
              - Rtel1
              - Eno1
            maxItems: 500
          style: form
          explode: false
        - name: tissueId
          in: query
          required: false
          description: Select tissues; omitted means all tissues.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: tissueSiteDetailId
          in: query
          required: false
          description: Legacy alias of tissueId. Do not use both aliases.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: cluster
          in: query
          required: false
          description: Compute average-linkage Euclidean clustering with optimal leaf
            ordering on the released TPM medians. Maximum 200 genes when
            enabled; 500 with cluster=false.
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  clusters:
                    type: object
                    properties:
                      gene:
                        type: string
                        example: ((Rtel1:233.244,Polr3k:233.244):1054.57,Eno1:1287.81);
                      tissue:
                        type: string
                        example: ((IL:12.7061,LHb:12.7061):291.773,NAcc:304.479);
                  medianGeneExpression:
                    type: array
                    items:
                      type: object
                      properties:
                        geneId:
                          type: string
                          example: Rtel1
                        median:
                          type: number
                          example: 22.957
                        tissueSiteDetailId:
                          type: string
                          example: IL
                  notFound:
                    type: array
                    items:
                      type: string
        "304":
          description: Unchanged representation (If-None-Match matched the ETag).
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "503":
          $ref: "#/components/responses/503"
      operationId: medianGeneExpression
  /singleTissueEqtl:
    get:
      tags:
        - xQTL
      summary: Significant single-tissue cis-variants for a gene
      description: Deprecated alias of /significantCisEqtls. Use that path for new
        integrations. Query parameters, defaults and response envelopes are
        identical. Fetch all significant cis-variants in all tissues for a gene
        Returns the full numeric precision stored in the source archive; no
        additional rounding is applied. This contains significant associations,
        not every tested cis-window variant.
      parameters:
        - name: geneId
          in: query
          description: Gene ID Rat gene symbol/annotation identifier, not an Ensembl ID.
          required: true
          schema:
            type: string
            example: Cd300lf
        - name: tissueId
          in: query
          required: false
          description: Select tissues; omitted means all tissues.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: tissueSiteDetailId
          in: query
          required: false
          description: Legacy alias of tissueId. Do not use both aliases.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: limit
          in: query
          required: false
          description: Optional page size. Omit both limit and offset to preserve the full
            legacy response.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          required: false
          description: Zero-based record offset. Pagination metadata appears when limit or
            offset is supplied.
          schema:
            type: integer
            minimum: 0
            maximum: 1000000000
            default: 0
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  singleTissueEqtl:
                    type: array
                    items:
                      type: object
                      properties:
                        chromosome:
                          type: string
                          example: chr10
                        geneId:
                          type: string
                          example: Cd300lf
                        nes:
                          type: number
                          example: 0.592446
                          description: Legacy name for the regression slope (not log2 aFC).
                        pValue:
                          type: number
                          example: 2.111e-10
                        pos:
                          type: integer
                          example: 99876736
                        tissueSiteDetailId:
                          type: string
                          example: BLA
                        variantId:
                          type: string
                          example: chr10:99876736
                        slope:
                          type: number
                          nullable: true
                          description: Preferred explicit name for the value also returned as nes.
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "304":
          description: Unchanged representation (If-None-Match matched the ETag).
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "503":
          $ref: "#/components/responses/503"
      operationId: singleTissueEqtl
      deprecated: true
  /tissueInfo:
    get:
      tags:
        - reference
      summary: Metadata for all tissues
      description: Fetch metadata for all tissues
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  tissueInfo:
                    type: array
                    items:
                      type: object
                      properties:
                        colorHex:
                          type: string
                          example: 377eb8
                        colorRgb:
                          type: string
                          example: 55,126,184
                        dataset:
                          type: string
                          example: ratgtex_v4_round11_1
                          description: Genotype cohort ID; use as genotypeDatasetId where supported.
                        datasetId:
                          type: string
                          example: ratgtex_v4
                        eGeneCount:
                          type: integer
                          example: 5475
                        expressedGeneCount:
                          type: integer
                          example: 24107
                        rnaSeqAndGenotypeSampleCount:
                          type: integer
                          example: 83
                        rnaSeqSampleCount:
                          type: integer
                          example: 83
                        tissueSite:
                          type: string
                          example: Brain
                        tissueSiteDetail:
                          type: string
                          example: Infralimbic cortex
                        tissueSiteDetailAbbr:
                          type: string
                          example: IL
                        tissueSiteDetailId:
                          type: string
                          example: IL
                        hasEGenes:
                          type: boolean
                          example: true
        "304":
          description: Unchanged representation (If-None-Match matched the ETag).
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "503":
          $ref: "#/components/responses/503"
      operationId: tissueInfo
  /topExpressedGene:
    get:
      tags:
        - expression
      summary: Top 50 genes by median expression in a tissue
      description: Fetch 50 genes with highest median expression in a tissue
      parameters:
        - name: filterMtGene
          in: query
          description: Whether mitochondrial genes should be omitted from the top gene list
          required: false
          schema:
            type: boolean
            example: true
        - name: tissueId
          in: query
          required: false
          description: Exactly one tissue is required using either alias.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: tissueSiteDetailId
          in: query
          required: false
          description: Legacy alias of tissueId. Do not use both aliases.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: limit
          in: query
          required: false
          description: Maximum returned genes, after mitochondrial filtering.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  topExpressedGene:
                    type: array
