  /expressionSummary:
    get:
      tags:
        - expression
      operationId: expressionSummary
      summary: Compact per-tissue expression summaries
      description: Summaries use finite measurements only, without returning sample
        vectors. Quartiles use linear interpolation; no sampling or
        approximation. These medians are computed from the per-sample file;
        medianGeneExpression uses the precompiled release matrix, rounded during
        data preparation.
      parameters:
        - name: geneId
          in: query
          required: true
          description: Up to 10 gene IDs.
          schema:
            type: array
            items:
              type: string
            maxItems: 10
          style: form
          explode: false
        - name: tissueId
          in: query
          required: false
          description: Select tissues; omitted means all tissues.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: tissueSiteDetailId
          in: query
          required: false
          description: Legacy alias of tissueId. Do not use both aliases.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: expressionScale
          in: query
          required: false
          description: "tpm: unnormalized transcripts per million. normalized:
            quantile-normalized, inverse-normal transformed expression
            phenotype. Does not recompute association statistics."
          schema:
            type: string
            enum:
              - tpm
              - normalized
            default: tpm
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  expressionSummary:
                    type: array
                    items:
                      type: object
                      properties:
                        geneId:
                          type: string
                          example: Cd300lf
                        tissueSiteDetailId:
                          type: string
                          example: IL
                        expressionScale:
                          type: string
                          enum:
                            - tpm
                            - normalized
                        unit:
                          type: string
                          enum:
                            - TPM
                            - normalized expression
                        sampleCount:
                          type: integer
                        nonMissingCount:
                          type: integer
                        zeroCount:
                          type: integer
                        mean:
                          type: number
                          nullable: true
                        median:
                          type: number
                          nullable: true
                        q1:
                          type: number
                          nullable: true
                        q3:
                          type: number
                          nullable: true
                        min:
                          type: number
                          nullable: true
                        max:
                          type: number
                          nullable: true
                  notFound:
                    type: array
                    items:
                      type: string
        "304":
          description: Unchanged representation.
        "400":
          $ref: "#/components/responses/400"
        "503":
          $ref: "#/components/responses/503"
  /genotypeExpression:
    get:
      tags:
        - xQTL
      summary: Genotype-stratified expression for one gene and variant
      description: Return expression and genotype dosage arrays in matching sample
        order. The default is the released quantile-normalized, inverse-normal
        transformed expression phenotype; expressionScale=tpm explicitly selects
        unnormalized TPM. P-values are precomputed, not recalculated from these
        vectors. Only fully called diploid biallelic genotypes contribute to
        frequencies; partial, missing, haploid or non-biallelic calls become
        null. Frequencies are null if all calls are missing. A sample absent
        from the VCF has null dosage.
      parameters:
        - name: geneId
          in: query
          description: Gene ID Rat gene symbol/annotation identifier, not an Ensembl ID.
          required: true
          schema:
            type: string
            example: Cd300lf
        - name: tissueId
          in: query
          required: false
          description: Exactly one tissue is required using either alias.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: tissueSiteDetailId
          in: query
          required: false
          description: Legacy alias of tissueId. Do not use both aliases.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: variantId
          in: query
          description: Variant ID
          required: true
          schema:
            type: string
            example: chr10:100826333
        - name: expressionScale
          in: query
          required: false
          description: "tpm: unnormalized transcripts per million. normalized:
            quantile-normalized, inverse-normal transformed expression
            phenotype. Does not recompute association statistics."
          schema:
            type: string
            enum:
              - tpm
              - normalized
            default: normalized
        - name: includeSampleIds
          in: query
          required: false
          description: Include sampleIds aligned one-to-one with data and, for
            /genotypeExpression, genotypes. Sample order is meaningful only
            together with these IDs.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  alt:
                    type: string
                    example: T
                  data:
                    type: array
                    items:
                      type: number
                      nullable: true
                    example:
                      - 2.2338
                      - 3.78302
                      - 3.71887
                      - 3.05015
                      - 2.46061
                  geneId:
                    type: string
                    example: Cd300lf
                  genotypes:
                    type: array
                    items:
                      type: integer
                      nullable: true
                      minimum: 0
                      maximum: 2
                    example:
                      - 1
                      - 1
                      - null
                      - 1
                      - 0
                  hetCount:
                    type: integer
                    example: 35
                  homoAltCount:
                    type: integer
                    example: 16
                  homoRefCount:
                    type: integer
                    example: 27
                  maf:
                    type: number
                    nullable: true
                    description: Minor allele frequency min(AF, 1-AF) among fully called diploid
                      samples. Corrected from the old alternate-allele-frequency
                      calculation.
                  pValue:
                    type: number
                    example: 8.43005e-8
                    nullable: true
                  pValueThreshold:
                    type: number
                    example: 0.00172939
                    nullable: true
                  ref:
                    type: string
                    example: C
                  tissueSiteDetailId:
                    type: string
                    example: IL
                  variantId:
                    type: string
                    example: chr10:100826333
                  altAlleleFrequency:
                    type: number
                    nullable: true
                    description: Alternate allele frequency among fully called diploid samples; can
                      exceed 0.5.
                  calledSampleCount:
                    type: integer
                  missingGenotypeCount:
                    type: integer
                  genotypeDatasetId:
                    type: string
                  expressionScale:
                    type: string
                    enum:
                      - tpm
                      - normalized
                  unit:
                    type: string
                    enum:
                      - TPM
                      - normalized expression
                  sampleIds:
                    type: array
                    items:
                      type: string
        "304":
          description: Unchanged representation (If-None-Match matched the ETag).
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "422":
          $ref: "#/components/responses/422"
        "503":
          $ref: "#/components/responses/503"
      operationId: genotypeExpression
  /significantCisEqtls:
    get:
      tags:
        - xQTL
      summary: Significant single-tissue cis-variants for a gene
      description: Fetch all significant cis-variants in all tissues for a gene
        Returns the full numeric precision stored in the source archive; no
        additional rounding is applied. This contains significant associations,
        not every tested cis-window variant. The response retains the
        singleTissueEqtl collection key for compatibility. These are significant
        cis-eQTL associations across the selected tissues, distinct from the
        conditionally independent leads returned by /eqtl.
      parameters:
        - name: geneId
          in: query
          description: Gene ID Rat gene symbol/annotation identifier, not an Ensembl ID.
          required: true
          schema:
            type: string
            example: Cd300lf
        - name: tissueId
          in: query
          required: false
          description: Select tissues; omitted means all tissues.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: tissueSiteDetailId
          in: query
          required: false
          description: Legacy alias of tissueId. Do not use both aliases.
          schema:
            type: array
            items:
              type: string
            maxItems: 100
          style: form
          explode: false
        - name: limit
          in: query
          required: false
          description: Optional page size. Omit both limit and offset to preserve the full
            legacy response.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          required: false
          description: Zero-based record offset. Pagination metadata appears when limit or
            offset is supplied.
          schema:
            type: integer
            minimum: 0
            maximum: 1000000000
            default: 0
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  singleTissueEqtl:
                    type: array
                    items:
                      type: object
                      properties:
                        chromosome:
                          type: string
                          example: chr10
                        geneId:
                          type: string
                          example: Cd300lf
                        nes:
                          type: number
                          example: 0.592446
                          description: Legacy name for the regression slope (not log2 aFC).
                        pValue:
                          type: number
                          example: 2.111e-10
                        pos:
                          type: integer
                          example: 99876736
                        tissueSiteDetailId:
                          type: string
                          example: BLA
                        variantId:
                          type: string
                          example: chr10:99876736
                        slope:
                          type: number
                          nullable: true
                          description: Preferred explicit name for the value also returned as nes.
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "304":
          description: Unchanged representation (If-None-Match matched the ETag).
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "503":
          $ref: "#/components/responses/503"
      operationId: significantCisEqtls
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        status:
          type: integer
    Pagination:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
  responses:
    "400":
      description: Missing or invalid query parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "404":
      description: Requested resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    "422":
